plugins {
    // Apply the application plugin to add support for building a CLI application in Java.
    id 'application'
}

repositories {
    // Use Maven Central for resolving dependencies.
    mavenCentral()
}

dependencies {
    // Use JUnit Jupiter for testing.
    testImplementation 'org.junit.jupiter:junit-jupiter:5.12.1'

    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

    // JSON для сохранения маршрута
    implementation 'com.google.code.gson:gson:2.10.1'
}

// Apply a specific Java toolchain to ease working on different environments.
java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

application {
    mainClass = 'gui.RobotsProgram'
    applicationDefaultJvmArgs = ["-Dsun.java2d.uiScale=1.0"]
}

tasks.register('runDiagnostic', JavaExec) {
    mainClass = 'diagnostic.DiagnosticImageLoader'
    classpath = sourceSets.main.runtimeClasspath
    workingDir = projectDir
}

tasks.register('generateStar', JavaExec) {
    mainClass = 'diagnostic.GenerateStarImage'
    classpath = sourceSets.main.runtimeClasspath
    workingDir = projectDir
}

tasks.named('test') {
    // Use JUnit Platform for unit tests.
    useJUnitPlatform()
}

tasks.withType(Test) {
    // Запускать тесты в том же процессе JVM, что и Gradle
    // Это обходит проблемы с созданием дочерних процессов.
    forkEvery = 1
    maxParallelForks = 1

    // Явно указываем использовать ту же JVM, что и для сборки
    javaLauncher = javaToolchains.launcherFor {
        languageVersion = JavaLanguageVersion.of(25)
    }

    // Добавляем флаг для диагностики, если проблема с памятью
    jvmArgs += "-Xmx512m"
}